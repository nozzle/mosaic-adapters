name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel an in-flight release: a cancelled publish job can leave a
# partially published release. Queued runs wait for the current one instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Reset permissions and grant them per job.
permissions: {}

jobs:
  ci:
    name: CI
    # `workflow_dispatch` can target any branch; only ever release from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # to check out the repo
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Tools
        uses: TanStack/config/.github/setup@7bbdf583c2fc1a7f596283cd01e0e44c43f574f2 # main

      - name: Check GitHub Action pins
        run: pnpm run actions:pin-check

      - name: Run CI checks
        run: pnpm run test:ci

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      # Pack the tarballs from this job's verified build so the publish job
      # never runs a build while holding `id-token: write`.
      - name: Pack packages
        id: pack
        if: steps.select-mode.outputs.mode == 'publish'
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}

  version:
    name: Version
    needs: ci
    if: needs.ci.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to commit version changes to the release branch
      pull-requests: write # to open or update the release PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Tools
        uses: TanStack/config/.github/setup@7bbdf583c2fc1a7f596283cd01e0e44c43f574f2 # main

      - name: Create or update release PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run changeset:version
          commit-message: 'ci: version packages'
          pr-title: 'ci: version packages'

  publish:
    name: Publish
    needs: ci
    if: needs.ci.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to push git tags and create GitHub releases
      id-token: write # for npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: TanStack/config/.github/setup@7bbdf583c2fc1a7f596283cd01e0e44c43f574f2 # main

      - name: Show release tool versions
        run: |
          node --version
          pnpm --version

      - name: Publish to npm
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.ci.outputs.pack-dir-artifact-id }}
          create-github-releases: true
        env:
          # pnpm 11 publishes natively and ignores `NPM_CONFIG_*` settings.
          PNPM_CONFIG_PROVENANCE: 'true'

      # A publish without an attestation does not fail on its own, so check
      # that every published version carries npm provenance. The registry can
      # take a couple of minutes to expose a new version after `publish`
      # returns, and the packument `npm view` reads is CDN-cached for up to
      # 5 minutes on top of that. So poll the uncached attestations endpoint
      # instead, against one 10-minute deadline shared by all packages.
      - name: Verify provenance attestations
        if: steps.publish.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
        run: |
          deadline=$((SECONDS + 600))
          for spec in $(jq -r '.[] | "\(.name)@\(.version)"' <<< "$PUBLISHED_PACKAGES"); do
            url="https://registry.npmjs.org/-/npm/v1/attestations/${spec/\//%2f}"
            until curl -fsS "$url" | jq -e 'any(.attestations[]; .predicateType | startswith("https://slsa.dev/provenance/"))' > /dev/null; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::No provenance attestation found for $spec within 10 minutes of publishing"
                exit 1
              fi
              sleep 15
            done
            echo "Provenance verified for $spec"
          done
