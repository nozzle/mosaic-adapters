name: pr

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_VAR: FooBar

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Tools
        uses: TanStack/config/.github/setup@0e4c94811ee024520b2ea330855f2d38549a7d92 # main

      - name: Check GitHub Action pins
        run: pnpm run actions:pin-check

      - name: Get base and head commits for `nx affected`
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: main

      - name: Cache Playwright browsers
        # Keep this PR workflow's cache scoped to the PR so PR runs do not pollute main.
        # If a similar setup is needed on main, create a separate ci.yml that is
        # audited exclusively for the main context, especially cache poisoning risks.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-pr-${{ github.event.pull_request.number }}

      - name: Install Playwright browsers
        run: pnpm run playwright:install

      - name: Check formatting
        run: pnpm run test:format

      - name: Run checks for PR
        run: pnpm run test:pr
