packages:
  - packages/*
  - examples/react/*

catalog:
  '@duckdb/duckdb-wasm': 1.33.1-dev114.0
  '@playwright/test': ^1.64.1
  '@tanstack/react-store': ^0.11.2
  '@tanstack/react-table': ^9.3.1
  '@tanstack/store': ^0.11.2
  '@tanstack/table-core': ^9.3.1
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@types/node': ^26.6.6
  '@uwdata/flechette': ^2.7.1
  '@uwdata/mosaic-core': ^0.35.0
  '@uwdata/mosaic-sql': ^0.35.0
  '@uwdata/vgplot': ^0.35.0
  '@vitejs/plugin-react': ^6.1.2
  jsdom: ^30.1.3
  oxfmt: ^0.75.0
  oxlint: ^1.90.0
  oxlint-tsgolint: ^7.0.2005
  publint: ^0.3.25
  rimraf: ^6.1.3
  tsdown: ^0.23.4
  typescript: ^7.0.2
  vite: ^8.3.5
  vitest: ^5.0.5

cleanupUnusedCatalogs: true

linkWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild

preferWorkspacePackages: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@nozzleio/*'
  - '@tanstack/react-table'
  - '@tanstack/table-core'
  - '@duckdb/duckdb-wasm@1.33.1-dev114.0'
  - '@uwdata/flechette'
  - '@uwdata/mosaic-*'
  - '@uwdata/vgplot'
  - '@uwdata/wk-geojson'

overrides:
  '@nozzleio/mosaic-tanstack-table-core': 'workspace:*'
  '@nozzleio/mosaic-tanstack-react-table': 'workspace:*'
  '@nozzleio/mosaic-core': 'workspace:*'
  '@nozzleio/react-mosaic': 'workspace:*'
  '@nozzleio/test-support': 'workspace:*'

allowBuilds:
  esbuild: true
  nx: true
  unrs-resolver: true
