packages:
  - packages/*
  - examples/react/*

catalog:
  '@duckdb/duckdb-wasm': 1.33.1-dev57.0
  '@playwright/test': ^1.63.0
  '@tanstack/react-store': ^0.11.1
  '@tanstack/react-table': ^9.2.4
  '@tanstack/store': ^0.11.1
  '@tanstack/table-core': ^9.2.4
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@types/node': ^26.6.2
  '@uwdata/flechette': ^2.5.0
  '@uwdata/mosaic-core': ^0.32.0
  '@uwdata/mosaic-sql': ^0.32.0
  '@uwdata/vgplot': ^0.32.0
  '@vitejs/plugin-react': ^6.1.1
  jsdom: ^30.1.1
  oxfmt: ^0.70.0
  oxlint: ^1.85.0
  oxlint-tsgolint: ^7.0.2002
  publint: ^0.3.18
  rimraf: ^6.1.3
  tsdown: ^0.23.0
  typescript: ^7.0.2
  vite: ^8.3.0
  vitest: ^5.0.1

cleanupUnusedCatalogs: true

linkWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild

preferWorkspacePackages: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@nozzleio/*'
  - '@tanstack/react-table'
  - '@tanstack/table-core'
  - '@uwdata/flechette'
  - '@uwdata/mosaic-*'
  - '@uwdata/vgplot'

overrides:
  '@nozzleio/mosaic-tanstack-table-core': 'workspace:*'
  '@nozzleio/mosaic-tanstack-react-table': 'workspace:*'
  '@nozzleio/mosaic-core': 'workspace:*'
  '@nozzleio/react-mosaic': 'workspace:*'
  '@nozzleio/test-support': 'workspace:*'

allowBuilds:
  esbuild: true
  nx: true
  unrs-resolver: true
